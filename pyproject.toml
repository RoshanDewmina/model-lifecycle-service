[project]
name = "model-lifecycle-service"
version = "0.1.0"
description = "Reproducible wine-cultivar training, gated release, rollback, and serving demo"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.116,<1",
  "numpy>=2.2,<3",
  "scikit-learn>=1.7,<2",
  "skops>=0.13,<1",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
modelctl = "model_lifecycle.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_lifecycle"]

[tool.hatch.build.targets.wheel.force-include]
"src/model_lifecycle/static" = "model_lifecycle/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

